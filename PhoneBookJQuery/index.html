<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Телефонная книга</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="node_modules/jquery/dist/jquery.min.js"></script>
    <script defer src="script.js"></script>
</head>
<body>
<div class="container">
    <h1 class="main-header mb-2 pt-2">Телефонная книга</h1>

    <div class="row g-3">
        <div class="col-md-6">

            <label for="phonebook" class="form-label">Таблица контактов</label>

            <table class="table table-bordered" id="phonebook">
                <thead class="table-primary">
                <tr>
                    <th scope="col">№</th>
                    <th scope="col">Фамилия</th>
                    <th scope="col">Имя</th>
                    <th scope="col">Номер телефона</th>
                    <th scope="col"></th>
                </tr>
                </thead>
                <tbody class="table-light table-striped-columns" id="phonebook-body">
                </tbody>
            </table>
        </div>

        <div class="col-auto">

            <form id="new-contact-form">
                <div class="mb-3">
                    <label for="new-contact-surname" class="form-label">Фамилия</label>
                    <input type="text" class="form-control" id="new-contact-surname" placeholder="Иванов">
                    <div class="invalid-feedback">Необходимо заполнить поле "Фамилия"</div>
                </div>

                <div class="mb-3">
                    <label for="new-contact-name" class="form-label">Имя</label>
                    <input type="text" class="form-control" id="new-contact-name" placeholder="Иван">
                    <div class="invalid-feedback">Необходимо заполнить поле "Имя"</div>
                </div>

                <div class="mb-3">
                    <label for="new-contact-phone-number" class="form-label">Номер телефона</label>
                    <input type="tel" class="form-control" id="new-contact-phone-number" placeholder="+7__________">
                    <div class="invalid-feedback">Необходимо заполнить поле "Номер телефона"</div>
                </div>

                <button class="btn btn-primary" type="submit">Создать</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
