<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Телефонная книга</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="node_modules/vue/dist/vue.global.js"></script>
    <script defer src="node_modules/axios/dist/axios.min.js"></script>
    <script defer src="script.js"></script>
</head>
<body>
<div id="app" class="container p-3">
    <h1 class="main-header">Телефонная книга</h1>

    <form @submit.prevent="addContact" class="mt-3">
        <div class="mb-3">
            <label for="name" class="form-label">Имя</label>
            <input v-model.trim="name" type="text" id="name"
                   class="form-control" placeholder="Введите имя"
                   :class="{ 'is-invalid': isNameInvalid }">
            <div class="invalid-feedback">Необходимо заполнить поле "Имя"</div>
        </div>
        <div class="mb-3">
            <label for="surname" class="form-label">Фамилия</label>
            <input v-model.trim="surname" type="text" id="surname"
                   class="form-control" placeholder="Введите фамилию"
                   :class="{ 'is-invalid': isSurnameInvalid }">
            <div class="invalid-feedback">Необходимо заполнить поле "Фамилия"</div>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">Телефон</label>
            <input v-model.trim="phone" type="tel" id="phone"
                   class="form-control" placeholder="Введите телефон"
                   :class="{ 'is-invalid': isPhoneInvalid }">
            <div class="invalid-feedback">Необходимо заполнить поле "Телефон"</div>
        </div>
        <button type="submit" class="btn btn-primary">Создать</button>
    </form>

    <form @submit.prevent="getContacts" class="row mt-3">
        <div class="col-12">
            <label for="search-text" class="mb-2"><strong>Поиск</strong></label>
        </div>
        <div class="col">
            <input v-model="searchText" type="text" class="form-control" id="search-text"
                   placeholder="Введите текст для поиска">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Поиск</button>
        </div>
    </form>

    <div class="table-responsive mt-3">
        <table class="table table-bordered table-striped">
            <thead class="table-primary">
            <tr>
                <th scope="col">№</th>
                <th scope="col">Фамилия</th>
                <th scope="col">Имя</th>
                <th scope="col">Телефон</th>
                <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr v-for="(contact, index) in contacts" :key="contact.id">
                <td v-text="index + 1"></td>

                <template v-if="contact.isEditing">
                    <td>
                        <input v-model.trim="contact.editSurname" type="text"
                               class="form-control form-control-sm"
                               placeholder="Фамилия"
                               :class="{ 'is-invalid': contact.isEditSurnameInvalid }">
                        <div class="invalid-feedback">Необходимо заполнить поле "Фамилия"</div>
                    </td>
                    <td>
                        <input v-model.trim="contact.editName" type="text"
                               class="form-control form-control-sm"
                               placeholder="Имя"
                               :class="{ 'is-invalid': contact.isEditNameInvalid }">
                        <div class="invalid-feedback">Необходимо заполнить поле "Имя"</div>
                    </td>
                    <td>
                        <input v-model.trim="contact.editPhone" type="tel"
                               class="form-control form-control-sm"
                               placeholder="Телефон"
                               :class="{ 'is-invalid': contact.isEditPhoneInvalid }">
                        <div class="invalid-feedback">Необходимо заполнить поле "Телефон"</div>
                    </td>
                    <td class="text-nowrap">
                        <button @click="saveContact(contact)" class="btn btn-success btn-sm me-1"
                                title="Сохранить" type="button">
                            <i class="bi bi-check-lg"></i>
                        </button>
                        <button @click="cancelEditing(contact)" class="btn btn-secondary btn-sm"
                                title="Отменить" type="button">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </td>
                </template>

                <template v-else>
                    <td v-text="contact.surname"></td>
                    <td v-text="contact.name"></td>
                    <td v-text="contact.phone"></td>
                    <td class="text-nowrap">
                        <button @click="startEditing(contact)" class="btn btn-warning btn-sm me-1"
                                title="Редактировать" type="button">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button @click="deleteContact(contact)" class="btn btn-danger btn-sm"
                                title="Удалить" type="button">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </template>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
